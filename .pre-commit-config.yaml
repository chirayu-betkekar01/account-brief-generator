# Install once:  pip install pre-commit && pre-commit install
# Run on demand: pre-commit run --all-files
# Hook versions were the latest releases on 2026-10-05; bump with `pre-commit autoupdate`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: detect-private-key
      # Fails if a staged file contains the value of a key from ~/.aws/credentials.
      # --allow-missing-credentials keeps it quiet on machines (CI) with no credentials file.
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.2
    hooks:
      - id: terraform_fmt

  # Scans staged changes for secrets (AWS keys, tokens, ...). Account IDs are caught by
  # the project's own .gitignore rules (tfstate/tfvars) rather than a regex here.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
